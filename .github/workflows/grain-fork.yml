name: Grain fork contract

on:
  push:
    branches: ["codex/grain-*", "grain/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grain-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native CPU contracts and CLI
        shell: bash
        run: |
          cmake -S . -B build-grain -DTRANSCRIBE_BUILD_TESTS=ON -DTRANSCRIBE_BUILD_EXAMPLES=ON -DTRANSCRIBE_BUILD_SHARED=OFF -DTRANSCRIBE_METAL=OFF -DTRANSCRIBE_VULKAN=OFF -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build-grain --config Release --parallel 2
          ctest --test-dir build-grain -C Release --output-on-failure
      - name: Formatting and generated ABI
        shell: bash
        run: |
          cargo fmt --all -- --check
          uv run --no-project --with libclang==18.1.1 bindings/python/_generate/generate.py --check
          uv run --no-project --with libclang==18.1.1 python -c "import clang.cindex, os, subprocess; os.environ['LIBCLANG_PATH']=clang.cindex.Config.library_path; subprocess.check_call(['cargo','run','--locked','-p','xtask','--','bindgen','--check'])"
          uv run --no-project scripts/ci/swift_abihash_check.py
          uv run --no-project scripts/ci/rust_package_audit.py
          scripts/ci/clang-format.sh --check-diff 63a44d9239d610b3908e8a66b384924cd4a77217
      - name: Safe Rust source build and tests
        shell: bash
        run: |
          cargo test --locked -p transcribe-cpp --no-default-features --lib --test no_model -- --test-threads=1
          cargo clippy --locked -p transcribe-cpp --no-default-features --all-targets -- -D warnings
          cargo run --locked -p transcribe-cpp --no-default-features --example grain_contract
      - name: Cargo shared-library consumption
        shell: bash
        run: |
          cargo build --locked -p transcribe-cpp --no-default-features --features dynamic-backends
          cargo run --locked -p transcribe-cpp --no-default-features --features dynamic-backends --example grain_contract
      - name: Source archive identity without Git metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/grain-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/grain-source"
          cmake -S "$RUNNER_TEMP/grain-source" -B "$RUNNER_TEMP/grain-archive-build" -DTRANSCRIBE_BUILD_TESTS=ON -DTRANSCRIBE_BUILD_SHARED=ON -DTRANSCRIBE_METAL=OFF -DTRANSCRIBE_VULKAN=OFF -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build "$RUNNER_TEMP/grain-archive-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/grain-archive-build" --output-on-failure
      - name: Apple Metal source build
        if: runner.os == 'macOS'
        run: cargo build --locked -p transcribe-cpp --features metal
